name: Build Windows VST3

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Collect plugin
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Recurse "build/TransientBloom_artefacts/Release/VST3/Transient Bloom.vst3" dist/
          Copy-Item "build/TransientBloom_artefacts/Release/Standalone/Transient Bloom.exe" dist/
          Copy-Item README.md dist/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: TransientBloom-Windows-VST3
          path: dist/
